  #     use_hook: true
  weixin_unread:
    type: "yasb.custom.CustomWidget"
    options:
      class_name: "weixin-unread"
      label: "{data}"
      label_alt: ""
      label_placeholder: ""
      label_max_length: null
      tooltip: false
      exec_options:
        run_cmd: 'powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\Users\songliyu\.config\yasb\scripts\weixin-unread-badge.ps1'
        run_once: false
        run_interval: 1000
        return_format: "string"
        hide_empty: false
        use_shell: false
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
